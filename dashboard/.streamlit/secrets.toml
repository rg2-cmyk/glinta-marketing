# Glinta Marketing — Streamlit Secrets
#
# To connect the Google Sheet on Streamlit Cloud:
#
# 1. Go to your Google Cloud Console
#    → IAM & Admin → Service Accounts
#    → Select "glinta-sheets-bot@glinta-marketing-studs-495303.iam.gserviceaccount.com"
#    → Keys → Add Key → Create new key → JSON
#    → Download the JSON file
#
# 2. Open the JSON file and copy the values into the section below,
#    replacing each placeholder.
#
# 3. In Streamlit Cloud: go to your app → Settings → Secrets
#    and paste the entire [gcp_service_account] block there.
#
# [gcp_service_account]
# type = "service_account"
# project_id = "glinta-marketing-studs-495303"
# private_key_id = "YOUR_PRIVATE_KEY_ID"
# private_key = "-----BEGIN RSA PRIVATE KEY-----\nYOUR_KEY_HERE\n-----END RSA PRIVATE KEY-----\n"
# client_email = "glinta-sheets-bot@glinta-marketing-studs-495303.iam.gserviceaccount.com"
# client_id = "YOUR_CLIENT_ID"
# auth_uri = "https://accounts.google.com/o/oauth2/auth"
# token_uri = "https://oauth2.googleapis.com/token"
# auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
# client_x509_cert_url = "https://www.googleapis.com/robot/v1/metadata/x509/glinta-sheets-bot%40glinta-marketing-studs-495303.iam.gserviceaccount.com"
